# Host Caddy site block for the Umami dashboard - paste into the server's
# Caddyfile next to the app block (deploy/caddy.bbrsquashspb.conf).
#
# This block serves the DASHBOARD only. The tracker itself is never loaded from
# here: the app proxies /u/script.js and /u/api/send to bbr-umami:3000 from its
# own origin, because the app CSP allows only 'self' for script-src/connect-src
# and blocker lists drop third-party analytics hosts.
#
# bbr-umami joins the same external `caddy` network as bbr-app, so Caddy reaches
# it by container name.
analytics.ohmyapps.xyz {
    encode zstd gzip

    header {
        X-Content-Type-Options "nosniff"
        X-Frame-Options "SAMEORIGIN"
        Referrer-Policy "strict-origin-when-cross-origin"
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        -Server
    }

    # The dashboard is a login-gated admin surface: keep it off search engines.
    header /robots.txt Content-Type "text/plain"
    respond /robots.txt "User-agent: *
Disallow: /"

    reverse_proxy bbr-umami:3000 {
        header_up Host {host}
        header_up X-Real-IP {remote_host}
    }

    tls {
        dns porkbun {
            api_key {env.PORKBUN_API_KEY}
            api_secret_key {env.PORKBUN_SECRET_API_KEY}
        }
    }

    log {
        output file /var/log/caddy/analytics_access.log
        format console
        level INFO
    }
}
